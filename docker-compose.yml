services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callapp
      POSTGRES_PASSWORD: callapp
      POSTGRES_DB: callapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callapp"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
    command: ["node", "dist/db/migrate.js"]
    restart: "no"

  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
      NODE_ENV: production
      JWT_SECRET: change-me-in-production
      AUTH_REQUIRED: "false"

  outbox-worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/workers/outbox.js"]
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
      OUTBOX_MODE: poll
      OUTBOX_PUBLISH_TRANSPORT: ws
      OUTBOX_REALTIME_PUBLISH_URL: http://api:3000/api/internal/realtime/publish

volumes:
  pgdata:
