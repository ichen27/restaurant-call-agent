services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callapp
      POSTGRES_PASSWORD: callapp
      POSTGRES_DB: callapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callapp"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
    command: ["node", "dist/db/migrate.js"]
    restart: "no"

  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
      NODE_ENV: production
      JWT_SECRET: change-me-in-production
      AUTH_REQUIRED: "false"

  outbox-worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/workers/outbox.js"]
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://callapp:callapp@db:5432/callapp
      OUTBOX_MODE: poll
      OUTBOX_PUBLISH_TRANSPORT: ws
      OUTBOX_REALTIME_PUBLISH_URL: http://api:3000/api/internal/realtime/publish

  call-worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/workers/call.js"]
    ports:
      - "3001:3001"
    environment:
      CALL_WORKER_PORT: "3001"
      API_BASE_URL: http://api:3000
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-change-me-in-production}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-gpt-4o-realtime-preview}"
      OPENAI_VOICE: "${OPENAI_VOICE:-alloy}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"

volumes:
  pgdata:
